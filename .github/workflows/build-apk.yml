name: Build APK (Chaquopy)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ruslan-agent-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        working-directory: android-app
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > signing.keystore
            ZIPALIGN=$(ls -1 "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
            APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            echo "Using zipalign: $ZIPALIGN"
            echo "Using apksigner: $APKSIGNER"
            "$ZIPALIGN" -p -f 4 \
              android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
              app-release-aligned.apk
            "$APKSIGNER" sign \
              --ks signing.keystore \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_KEY_PASSWORD" \
              --key-pass "pass:$SIGNING_KEY_PASSWORD" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out ruslan-agent.apk \
              app-release-aligned.apk
            "$APKSIGNER" verify --verbose ruslan-agent.apk
            ls -la ruslan-agent.apk
            sha256sum ruslan-agent.apk
            rm -f app-release-aligned.apk
          fi

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ruslan-agent-release
          path: ruslan-agent.apk
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ruslan-agent.apk
          generate_release_notes: true
# trigger
