name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Termux Bootstrap
        run: |
          mkdir -p android-app/app/src/main/assets
          cd android-app/app/src/main/assets
          
          # Download Termux APK and extract bootstrap
          curl -sL -o termux.apk "https://f-droid.org/repo/com.termux_118.apk"
          unzip -q termux.apk -d termux_extract
          
          # Extract bootstrap from libtermux-bootstrap.so
          # The zip is embedded at offset 0x570 (1392 bytes)
          tail -c +1393 termux_extract/lib/arm64-v8a/libtermux-bootstrap.so > bootstrap.zip
          
          # Extract bootstrap
          mkdir -p prefix
          cd prefix
          unzip -q ../bootstrap.zip
          
          # Create usr.tar.zst
          cd ..
          tar -C prefix -cf - . | zstd -19 -T0 > usr.tar.zst
          sha256sum usr.tar.zst > usr.tar.zst.sha256
          
          # Cleanup
          rm -rf termux.apk termux_extract bootstrap.zip prefix
          
          ls -lh usr.tar.zst

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruslan-agent-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
